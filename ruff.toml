#
# A project config replaces the global one wholesale rather than merging with
# it; `extend` overrules this to pull in the shared rule set. Without it this
# file would silently drop every rule the global config selects.

extend = "~/.config/ruff/pyproject.toml"

[lint.per-file-ignores]
# scratch/ holds exploratory probe scripts held to a lighter bar than
# production (see the exploratory-mode policy in the global style guide).
# They are run by hand, never imported by production code, so demanding
# annotations there is noise rather than protection — the same reasoning
# mypy.ini applies when it excludes the directory outright. Every other
# rule stays live: a probe that reads an undefined name wastes a model run
# just as surely as production would.
"cluegen/scratch/**" = ["ANN"]
