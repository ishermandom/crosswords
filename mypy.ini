#
# explicit_package_bases tells mypy to anchor module names at the repo root,
# so cluegen/local/ resolves as cluegen.local rather than also appearing as
# a top-level local package.
# scratch/ holds exploratory probe scripts held to a lighter bar than
# production (see the exploratory-mode policy in the global style guide);
# they are run by hand, never imported by production code, so strict type
# checking there is noise rather than protection.
[mypy]
explicit_package_bases = True
exclude = (^|/)scratch/
