#
# Why this is an installable package: local/ has a runtime dependency on openai
# (the HTTP client for Ollama's OpenAI-compatible API) and publishes the
# clue-gen CLI entry point, both of which want a real distribution behind them.
# cloud/ shells out to claude directly and declares no dependencies, so it stays
# as flat scripts.
#
# Why pyproject.toml lives at cluegen/ rather than cluegen/local/: the
# package is published as the cluegen.local namespace, which requires hatchling
# to remap the local/ source directory to cluegen/local/ when building. That
# remapping is expressed in [tool.hatch.build.targets.*] below.
#
# This is a member of the workspace rooted at the repo root, which owns the
# shared `.venv`, the lockfile, and the tool configuration. What stays here is
# what belongs to this project alone.

[project]
name = "clue-gen"
version = "0.1.0"
requires-python = ">=3.11"

# openai is a runtime dep: it's the HTTP client we use to talk to Ollama's
# OpenAI-compatible API. >=1.0 because that release replaced the old module-
# level API (openai.ChatCompletion.create) with the openai.OpenAI() client
# class that we rely on.
dependencies = [
  "openai>=1.0",
]

[project.scripts]
clue-gen = "cluegen.local.cli:main"

# Groups rather than extras: the wheel ships only local/, so an extra would
# advertise dependencies for code the installer never receives. A group stays
# out of the published metadata and is reachable only from this checkout.
#
# The dev tooling shared by every project in this repo lives in the workspace
# root's `dev` group. What follows belongs to this project alone.
[dependency-groups]
# scratch/ posts to Ollama's HTTP endpoint through httpx directly rather than
# through the openai client. Nothing else supplies it — openai depends on
# httpx2, a separate distribution — so without this entry `import httpx` has no
# installed package behind it.
scratch = [
  "httpx",
]

# Fine-tuning probe (see local/finetune.md): mlx-lm supplies QLoRA training
# (mlx_lm.lora) over quantized Gemma checkpoints; mlx-optiq supplies unfused
# adapter serving (optiq serve --adapter) with an OpenAI-compatible API.
# Reached with `uv sync --group finetune`, or `--all-groups`; deliberately not
# in a plain sync, since these are the one heavyweight install here and only
# the fine-tuning workflow needs them.
#
# Version floors are the current releases at selection time (2026-07-02):
# mlx-lm 0.31.3, mlx-optiq 0.2.10 — recent enough for Gemma 4 + OptiQ
# checkpoint support.
finetune = [
  "mlx-lm>=0.31",
  "mlx-optiq>=0.2.10",
  # Wordnet interface: concise glosses for the flat-definition register
  # control (loss_gaps diagnostics).
  "wn>=1.1",
]

# packages names the source directory to include; sources remaps it from
# local/ to cluegen/local/ in the installed distribution, establishing the
# cluegen.local namespace. cluegen/ itself is an implicit namespace package
# (no __init__.py needed).
[tool.hatch.build.targets.wheel]
packages = ["local"]

# Editable installs can't express the local/ → cluegen/local prefix rewrite
# through hatchling's default path detection — it raises rather than emit a
# broken install (https://github.com/pfmoore/editables/issues/20).
# dev-mode-dirs bypasses detection: it puts the listed directory — here the
# parent, i.e. the repo root — on the import path, under which cluegen/local
# resolves naturally. Relies on this project directory being named cluegen
# and sitting at the repo root.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"local" = "cluegen/local"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
